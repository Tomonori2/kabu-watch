# 株ウォッチ：データを毎日集める（GitHub が無料で動かしてくれるロボット）
# 平日に3回（日本時間）collect.py を動かし、data/ が変わったら保存して公開する。
# ・GitHub の予約は混むと数時間おくれる。とくに「ちょうど○時」は混むので17分にずらしている
# ・Yahoo の終値が夜おそくまで反映されない日があった（11/16）ので、回数を多めにしている
name: データを集める

on:
  schedule:
    - cron: "17 8 * * 1-5"    # 日本時間 月〜金 17:17（信用残・空売りの公表のあと）
    - cron: "17 12 * * 1-5"   # 日本時間 月〜金 21:17（終値の取り直し）
    - cron: "17 21 * * 0-4"   # 日本時間 火〜土 06:17（前の日の取り直し）
  workflow_dispatch:          # 手で「Run workflow」を押しても動く

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect.py
      - name: 変わっていたら保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新 $(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M')"
            git pull --rebase
            git push
          fi
